[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdconvert"
version = "0.4.2"
description = "Technical document conversion tool."
authors = [{ name = "Aaron Martinez" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12.1"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["tdconvert*"]

[tool.setuptools.package-data]
"tdconvert.docs" = ["*"]

[project.scripts]
tdconvert = "tdconvert.__main__:main"
